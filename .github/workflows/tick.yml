name: Send due reminders
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake the sender and deliver due reminders
        env:
          TICK_KEY: ${{ secrets.TICK_KEY }}
          SENDER_URL: ${{ secrets.SENDER_URL }}
        run: |
          curl -fsS --retry 4 --retry-delay 20 --retry-all-errors --max-time 90 -X POST -H "x-tick-key: $TICK_KEY" "$SENDER_URL/tick" -o /dev/null -w "HTTP %{http_code}\n"
